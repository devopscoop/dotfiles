format = """
$directory\
$git_branch\
$git_status\
$kubernetes\
$aws\
$line_break\
$character"""

# [directory]
# format = "[$path]($style) "
# truncation_length = 1
# truncate_to_repo = false
# style = "bold cyan"

# [git_branch]
# format = "[$symbol $branch]($style) "
# symbol = ""
# style = "bold purple"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
untracked = "?"
style = "bold red"

# [kubernetes]
# format = "[$symbol $context]($style) "
# symbol = "💠"
# disabled = false
# style = "bold blue"

# [aws]
# format = "[$symbol $profile]($style) "
# symbol = "☁️ "
# style = "bold yellow"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"


# Nerd fonts

[aws]
format = "[$symbol $profile]($style) "
style = "bold yellow"
symbol = " "

[azure]
symbol = " "

[battery]
full_symbol = "󰁹 "
charging_symbol = "󰂄 "
discharging_symbol = "󰂃 "
unknown_symbol = "󰂑 "
empty_symbol = "󰂎 "

[buf]
